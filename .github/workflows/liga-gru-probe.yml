name: Liga GRU probe
on:
  push:
    branches:
      - diagnose-v13-production
    paths:
      - '.github/workflows/liga-gru-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -L --max-time 70 -sS "https://pokemon-fichario.vercel.app/api/liga-gru-probe-temp" > liga-gru-probe-result2.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liga-gru-probe-result2.json
          git commit -m "Record Liga GRU probe 2" || exit 0
          git push origin HEAD:diagnose-v13-production
