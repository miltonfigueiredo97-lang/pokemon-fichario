name: Apply Binder V12

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_v12.py'
      - 'tools/apply_v12_1.py'
      - '.github/workflows/apply-v12.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply V12 links
        run: python tools/apply_v12.py
      - name: Apply V12.1 matching fixes
        run: python tools/apply_v12_1.py
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js v12.js api/mypcards-public.js
          git commit -m "Ativar V12.1: MYP e número completo"
          git push
