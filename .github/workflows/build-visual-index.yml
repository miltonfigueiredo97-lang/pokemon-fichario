name: Build card visual index

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/build-visual-index.mjs'
      - '.github/workflows/build-visual-index.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install image processor
        run: npm install --no-save sharp@0.33.5

      - name: Build visual fingerprint index
        run: node scripts/build-visual-index.mjs

      - name: Commit refreshed index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/card-visual-index.json
          if git diff --cached --quiet; then
            echo "Visual index unchanged."
          else
            git commit -m "chore: refresh card visual index [skip ci]"
            git pull --rebase origin main
            git push
          fi
