name: V13.5 Liga static data probe
on:
  push:
    branches:
      - fix-v135-condition-pricing-test
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe static Liga data candidates
        run: |
          OUT=v135-liga-static-probe.txt
          : > "$OUT"
          for ID in PLS pls bw8 BW8 134 135 200 250 300
          do
            URL="https://www.lmcorp.com.br/arquivos/up/prod_js/new_ed_assoc_tcg_2_ed_${ID}.js"
            TMP="$(mktemp)"
            CODE=$(curl -L --max-time 20 -sS -o "$TMP" -w '%{http_code}' "$URL" || true)
            echo "===== $ID HTTP $CODE bytes $(wc -c < "$TMP") =====" >> "$OUT"
            head -c 1200 "$TMP" >> "$OUT"
            echo >> "$OUT"
          done
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v135-liga-static-probe.txt
          git commit -m "Record Liga static data probe" || exit 0
          git push origin HEAD:fix-v135-condition-pricing-test
