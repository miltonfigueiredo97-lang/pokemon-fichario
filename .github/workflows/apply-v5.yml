name: Apply Binder V5 Fix

on:
  push:
    paths:
      - 'tools/apply_v5.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V5 patch
        run: python tools/apply_v5.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css script.js sw.js
          git commit -m 'Corrigir proporção do fichário e drag drop'
          git push
