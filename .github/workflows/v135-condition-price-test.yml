name: V13.5 condition price test
on:
  push:
    branches:
      - fix-v135-condition-pricing-test
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Read real MYP page by condition
        run: |
          cat > v135-test.cjs <<'EOF'
          const fs=require('fs');
          const {findAndScrapeMypBrowser}=require('./lib/myp-browser');
          (async()=>{
            const base={
              name:'Lugia-EX',
              number:'134/135',
              set:'Black & White 8: Tempestade de Plasma',
              setId:'PLS',
              lang:'pt-br',
              finish:'Foil'
            };
            const out={utc:new Date().toISOString()};
            for(const condition of ['DM','HP','SP','Nova']){
              out[condition]=await findAndScrapeMypBrowser(
                'https://mypcards.com/pokemon/produto/38909/lugia-ex',
                {...base,condition}
              );
            }
            fs.writeFileSync('v135-condition-price-result.json',JSON.stringify(out,null,2));
          })().catch(e=>{fs.writeFileSync('v135-condition-price-result.json',JSON.stringify({error:String(e),stack:e.stack},null,2));process.exitCode=1});
          EOF
          node v135-test.cjs
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v135-condition-price-result.json
          git commit -m "Record V13.5 condition-price baseline" || exit 0
          git push origin HEAD:fix-v135-condition-pricing-test
