name: Debug price sources
# verify V12.6b
on:
  push:
    paths:
      - '.github/workflows/debug-price-sources.yml'
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe public sources and deployed endpoints
        shell: bash
        run: |
          set +e
          OUT=debug-price-output.txt
          : > "$OUT"
          echo "UTC: $(date -u +%FT%TZ)" >> "$OUT"
          echo >> "$OUT"

          probe () {
            NAME="$1"
            URL="$2"
            TMP="$(mktemp)"
            echo "===== $NAME =====" >> "$OUT"
            echo "URL: $URL" >> "$OUT"
            CODE=$(curl -L --max-time 25 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' -H 'Accept-Language: pt-BR,pt;q=0.9,en;q=0.6' -sS -o "$TMP" -w '%{http_code}' "$URL")
            echo "HTTP: $CODE" >> "$OUT"
            echo "BYTES: $(wc -c < "$TMP")" >> "$OUT"
            echo "--- first 1200 chars ---" >> "$OUT"
            head -c 1200 "$TMP" >> "$OUT"
            echo >> "$OUT"
            echo "--- matching lines ---" >> "$OUT"
            grep -Eoi '.{0,160}(Lugia-EX|134/135|Lojistas e Certificados|Demais vendedores|R\$[^<]{0,30}|1\.299,83|1299\.83|price|preço|médio|medio).{0,160}' "$TMP" | head -n 80 >> "$OUT"
            echo >> "$OUT"
          }

          probe "MYP direct card" "https://mypcards.com/pokemon/produto/38909/lugia-ex"
          probe "MYP sitemap" "https://mypcards.com/sitemap.xml"
          probe "Liga search" "https://www.ligapokemon.com.br/?view=cards/search&card=Lugia-EX%20(134%2F135)"
          probe "PrecoTCG Lugia" "https://www.precotcg.com.br/card/bw8-134"
          probe "PrecoTCG Omanyte" "https://www.precotcg.com.br/card/sv03.5-180"
          probe "App MYP endpoint" "https://pokemon-fichario.vercel.app/api/mypcards-public?name=Lugia-EX&number=134%2F135&set=Black%20%26%20White%208%3A%20Tempestade%20de%20Plasma&finish=Foil&condition=DM"
          probe "App Liga endpoint" "https://pokemon-fichario.vercel.app/api/liga-public?name=Lugia-EX&number=134%2F135&finish=Foil&condition=DM"

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug-price-output.txt
          git commit -m "Debug price source responses" || exit 0
          git push
