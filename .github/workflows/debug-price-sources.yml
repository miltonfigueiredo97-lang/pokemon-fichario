name: Debug price sources
on:
  push:
    paths:
      - '.github/workflows/debug-price-sources.yml'
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe public sources and deployed endpoints
        shell: bash
        run: |
          set +e
          OUT=debug-search-index-bridge.txt
          : > "$OUT"
          echo "UTC: $(date -u +%FT%TZ)" >> "$OUT"
          echo >> "$OUT"

          probe () {
            NAME="$1"
            URL="$2"
            TMP="$(mktemp)"
            echo "===== $NAME =====" >> "$OUT"
            echo "URL: $URL" >> "$OUT"
            CODE=$(curl -L --max-time 25 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' -H 'Accept-Language: pt-BR,pt;q=0.9,en;q=0.6' -sS -o "$TMP" -w '%{http_code}' "$URL")
            echo "HTTP: $CODE" >> "$OUT"
            echo "BYTES: $(wc -c < "$TMP")" >> "$OUT"
            echo "--- first 1200 chars ---" >> "$OUT"
            head -c 1200 "$TMP" >> "$OUT"
            echo >> "$OUT"
            echo "--- matching lines ---" >> "$OUT"
            grep -Eoi '.{0,160}(Lugia-EX|134/135|Lojistas e Certificados|Demais vendedores|R\$[^<]{0,30}|1\.299,83|1299\.83|price|preço|médio|medio).{0,160}' "$TMP" | head -n 80 >> "$OUT"
            echo >> "$OUT"
          }

          probe "DDG exact Lugia" "https://html.duckduckgo.com/html/?q=%22Lugia-EX%22+%22134%2F135%22+site%3Amypcards.com%2Fpokemon%2Fproduto%2F38909"
          probe "Bing exact Lugia" "https://www.bing.com/search?q=%22Lugia-EX%22+%22134%2F135%22+site%3Amypcards.com%2Fpokemon%2Fproduto%2F38909"
          probe "DDG exact Omanyte" "https://html.duckduckgo.com/html/?q=%22Omanyte%22+%22180%2F165%22+site%3Amypcards.com%2Fpokemon%2Fproduto%2F206053"
          probe "Bing exact Omanyte" "https://www.bing.com/search?q=%22Omanyte%22+%22180%2F165%22+site%3Amypcards.com%2Fpokemon%2Fproduto%2F206053"

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug-search-index-bridge.txt
          git commit -m "Debug price source responses" || exit 0
          git push
