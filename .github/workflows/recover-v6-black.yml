name: Recover V6 Black Screen

on:
  push:
    paths:
      - 'tools/recover_v6_black.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover functional frontend
        run: python tools/recover_v6_black.py
      - name: Commit recovery
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js style.css sw.js
          git commit -m 'Recuperar frontend após erro V6'
          git push
