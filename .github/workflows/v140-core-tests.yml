name: V14 core tests
on:
  push:
    branches:
      - v140-production-fixes
    paths:
      - 'v140.js'
      - 'v8.js'
      - 'v122.js'
      - 'v140.css'
      - 'index.html'
      - 'script.js'
      - 'api/master-set.js'
      - 'api/set-catalog.js'
      - 'data/jp-set-labels.json'
      - 'api/card-image-fallback.js'
      - 'api/jp-card-image.js'
      - 'api/image-proxy.js'
      - 'sw.js'
      - 'supabase/functions/pokemon-price-worker/index.ts'
      - '.github/workflows/v140-core-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'v140.js'
      - 'v140.css'
      - 'index.html'
      - 'script.js'
      - 'api/master-set.js'
      - 'api/set-catalog.js'
      - 'data/jp-set-labels.json'
      - 'api/card-image-fallback.js'
      - 'api/jp-card-image.js'
      - 'api/image-proxy.js'
      - 'sw.js'
      - '.github/workflows/v140-core-tests.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Static syntax
        run: |
          node --check script.js
          node --check v8.js
          node --check v11fix.js
          node --check v122.js
          node --check v140.js
          node --check api/master-set.js
          node --check api/set-catalog.js
          node --check api/card-image-fallback.js
          node --check api/jp-card-image.js
          node --check api/image-proxy.js
          node --check sw.js
      - name: API behavior
        run: |
          cat > v140-core-test.cjs <<'EOF'
          const fs=require('fs');
          async function invoke(modPath,query){
            const handler=require('./'+modPath);
            return await new Promise((resolve,reject)=>{
              let status=200,headers={};
              const res={
                setHeader(k,v){headers[k]=v;},
                status(n){status=n;return this;},
                json(v){resolve({status,headers,body:v});}
              };
              Promise.resolve(handler({query},res)).catch(reject);
            });
          }
          (async()=>{
            const master=await invoke('api/master-set.js',{lang:'pt',set:'sv08'});
            const entries=master.body?.entries||[];
            const exeggcute=entries.filter(x=>x.apiId==='sv08-001');
            const masterPass=master.status===200&&master.body?.ok&&entries.length>252&&exeggcute.some(x=>x.finish==='Normal')&&exeggcute.some(x=>x.finish==='Reverse Foil');

            const classic=await invoke('api/master-set.js',{lang:'pt',set:'cel25cc',debug:'1'});
            const classicEntries=classic.body?.entries||[];
            const classicPass=classic.status===200&&classic.body?.ok&&classicEntries.length>=25;

            const set151=await invoke('api/master-set.js',{lang:'pt',set:'sv03.5'});
            const entries151=set151.body?.entries||[];
            const charm004=entries151.filter(x=>x.apiId==='sv03.5-004');
            const set151Pass=set151.status===200&&set151.body?.ok&&
              charm004.length===3&&
              charm004.some(x=>x.variantType==='normal'&&x.finish==='Normal')&&
              charm004.some(x=>x.variantType==='holo'&&x.finish==='Foil')&&
              charm004.some(x=>x.variantType==='reverse'&&x.finish==='Reverse Foil');

            const jp151=await invoke('api/master-set.js',{lang:'ja',set:'SV2a'});
            const jpEntries=jp151.body?.entries||[];
            const jpCharm=jpEntries.filter(x=>String(x.apiId||'').toLowerCase()==='sv2a-004');
            const jp151Pass=jp151.status===200&&jp151.body?.ok&&
              jpCharm.length===3&&
              jpCharm.some(x=>x.variantType==='normal'&&x.finish==='Normal')&&
              jpCharm.some(x=>x.variantFoil==='pokeball'&&x.finish==='Pokeball Foil')&&
              jpCharm.some(x=>x.variantFoil==='masterball'&&x.finish==='Masterball Foil');

            const img=await invoke('api/card-image-fallback.js',{name:'Umbreon ex',number:'091',hp:'',rarity:''});
            const imagePass=img.status===200&&img.body?.ok&&/^https?:/.test(img.body?.url||'');

            const js=fs.readFileSync('v140.js','utf8');
            const railJs=fs.readFileSync('v8.js','utf8');
            const pageJs=fs.readFileSync('v11fix.js','utf8');
            const html=fs.readFileSync('index.html','utf8');
            const css=fs.readFileSync('v140.css','utf8');
            const assertions={
              backgroundPrice:/queueBackgroundPrices/.test(js)&&/price_pending/.test(js)&&/Adicionando/.test(js),
              multiBinder:/pokemon_binders/.test(js)&&/Geral — todos os fichários/.test(js),
              sortGuard:/Movimentação só fica disponível/.test(js),
              scanner:/ocrCard/.test(js)&&/scanLiveTick/.test(js)&&/Confirme a carta/.test(js)&&/visuallyRankCandidates/.test(js)&&/image-proxy/.test(js),
              scannerVisualV1420:/scanCandidatePool/.test(js)&&/scannerVisualCanvases/.test(js)&&/visualDescriptor/.test(js)&&/parseScannerOCR/.test(js)&&/Lendo o nome no topo da carta/.test(js)&&/Comparando a arte da sua foto/.test(js),
              binderAddCardV1421:/id="v1421AddCard"/.test(js)&&/openAddForPosition\(currentPage\)/.test(js)&&/v1421-add-card/.test(css)&&/classList\.toggle\('hidden',isGeneral\(\)\)/.test(js),
              scannerIndependentNumberSearch:/searchTCGdex\(lang,'',number/.test(js)&&/numberCandidates/.test(js)&&/imageDescriptorCache/.test(js),
              masterSet:/api\/master-set/.test(js)&&/Master Set/.test(js)&&/queueBackgroundPrices\(\[\.\.\.collection\]\)/.test(js),
              japanese:/card-image-fallback/.test(js)&&/jp-card-image/.test(js),
              priceSort:/price_desc/.test(js)&&/price_asc/.test(js)&&/maior → menor/.test(js)&&/menor → maior/.test(js),
              favorites:/favorites/.test(js)&&/canonicalCardIdentityKey/.test(js)&&/★ Favoritas/.test(js),
              groupedGeneral:/groupedVirtualCards/.test(js)&&/_group_count/.test(js),
              valueScope:/summary_value_scope/.test(js)&&/Só as que tenho/.test(js)&&/Só as que não tenho/.test(js),
              mobileArtifact:!html.includes('\\\\n'),
              valueScopeCss:/v14-value-scope-control/.test(css),
              mobileBinderControls:/querySelector\('\.binder-area'\)/.test(js)&&/top:48px/.test(css)&&/binder-stage\{padding:96px 10px 10px!important\}/.test(css),
              mobileCardValues:/V14\.3 — mobile card values/.test(css)&&/\.pocket-card \.card-value/.test(css)&&/display:block!important/.test(css),
              masterGenerationFlow:/v14SeriesSelect/.test(js)&&/v14SetSelect/.test(js)&&/\/series\//.test(js),
              masterDuplicate:/liveMasterBinderName/.test(js)&&/\.eq\('set_id',setId\)/.test(js),
              masterImmediateReload:/hardCloseDialog\('v14BinderDialog'\)/.test(js)&&/await loadCardsV14\(false\)/.test(js),
              masterPromos:/isPromoSet/.test(js)&&/Promos não são misturadas automaticamente/.test(js),
              mobileDelete:/v14DeleteBinder/.test(js)&&/v14-delete-binder/.test(css)&&/Excluir fichário/.test(js),
              summaryOverlay:/z-index:75/.test(css),
              desktopUnifiedTopbar:/v14UnifiedTopbar/.test(js)&&/ensureUnifiedTopbar/.test(js)&&/positionUnifiedTopbar/.test(js)&&/v14-unified-topbar/.test(css)&&/border-right:1px solid/.test(css),
              directionalSort:/manual_asc/.test(js)&&/manual_desc/.test(js)&&/name_asc/.test(js)&&/name_desc/.test(js)&&/number_asc/.test(js)&&/number_desc/.test(js),
              binderViewScope:/V14\.viewScope/.test(js)&&/v14BinderViewScope/.test(js)&&/Mostrar no fichário/.test(js)&&!/updateSettings\(\{binder_view_scope/.test(js),
              viewScopeCss:/v14-binder-view-scope/.test(css),
              rapidPageSkip:/cancelPageFlip/.test(pageJs)&&/pageFlipSuppressUntil/.test(pageJs)&&/rapidWindow/.test(pageJs)&&/pageFlipBusy/.test(pageJs),
              topbarBinderEdges:/binder-spread/.test(js)&&/bar\.style\.left=\(sr\.left-ar\.left\)\+'px'/.test(js)&&/bar\.style\.width=sr\.width\+'px'/.test(js)&&/bar\.style\.transform='none'/.test(js),
              goStart:/v14GoStart/.test(js)&&/goToBinderStart/.test(js)&&/cancelBinderPageFlipV14/.test(pageJs),
              binderSearch:/v14BinderSearch/.test(js)&&/binderSearchScore/.test(js)&&/applyBinderSearch/.test(js)&&/v14-binder-search/.test(css)&&!/v14BinderSearchList/.test(js),
              filteredPriceRefresh:/visiblePriceTargetCards/.test(js)&&/updateVisiblePricesV14/.test(js)&&/Atualizar preços visíveis/.test(fs.readFileSync('v122.js','utf8')),
              singleCardPrice:/btnUpdateCardPrice/.test(html)&&/updateEditingCardPriceNow/.test(js)&&/price_priority:1000/.test(js),
              persistentPriceState:/price_processing_at/.test(js)&&/price_next_retry_at/.test(js)&&/price_last_error/.test(js),
              persistentWorkerSource:fs.existsSync('supabase/functions/pokemon-price-worker/index.ts'),
              toolbarClearance:/top:6px!important/.test(css)&&/padding:52px 18px 8px!important/.test(css)&&/place-items:start center!important/.test(css),
              summaryStatsRemoved:/#summaryPanel \.summary-grid\{[\s\S]*display:none!important/.test(css),
              compactSummaryActions:/#summaryPanel \.action-grid\{[\s\S]*repeat\(2,minmax\(0,1fr\)\)/.test(css)&&/#summaryPanel #v12UpdatePrices/.test(css)&&/#summaryPanel #v112Logout/.test(css),
              desktopRailRemoved:/document\.querySelectorAll\('\.v11-rail'\)\.forEach\(el=>el\.remove\(\)\)/.test(railJs)&&/\.v11-rail\{display:none!important\}/.test(css),
              filterSafety:/setStatusFilterV14/.test(js)&&/V14\.viewScope='all'/.test(js)&&/activeStatusFilter='all'/.test(js),
              duplicateMarketRemoved:/\.v122-market-sources\{display:none!important\}/.test(css),
              groupedSummaryActions:/organizeSummaryActionsV14/.test(js)&&/v1411Group_/.test(js)&&/id:'prices'/.test(js)&&/id:'excel'/.test(js)&&/id:'export'/.test(js)&&/id:'settings'/.test(js)&&/v1411-action-group/.test(css),
              cleanTopbarActions:!/id="v14FavoritesOnly"/.test(js)&&!/id="v14RenameBinder"/.test(js)&&/id="v14DeleteBinder"/.test(js),
              deleteConfirmation:/v14DeleteDialog/.test(js)&&/v14CancelDelete/.test(js)&&/v14ConfirmDelete/.test(js)&&/não pode ser desfeita/i.test(js)&&/v14-danger-button/.test(css),
              deleteCascadeFlow:/pokemon_binders/.test(js)&&/\.delete\(\)/.test(js)&&/Fichário e suas cartas foram excluídos permanentemente/.test(js),
              japaneseReadableLabels:/api\/set-catalog/.test(js)&&/englishById/.test(js)&&/displaySetName/.test(js),
              releaseOrderedSets:/set-catalog/.test(js)&&/ordem de lançamento/.test(js),
              jpLabelMap:JSON.parse(fs.readFileSync('data/jp-set-labels.json','utf8')).SVLN==='Stellar Tera Type Starter Set Sylveon ex',
              classicFallback:/jsonOrNull/.test(fs.readFileSync('api/master-set.js','utf8'))&&/fallbackLanguageUsed/.test(fs.readFileSync('api/master-set.js','utf8')),
              noHiddenPriceRefresh:/Abrir uma carta deve ser instantâneo/.test(fs.readFileSync('v122.js','utf8'))&&!/toda abertura de uma carta existente tenta atualizar/.test(fs.readFileSync('v122.js','utf8')),
              boundedSinglePrice:/querySingleCardPriceFast/.test(js)&&/fast:'1'/.test(js)&&/11000/.test(js)&&/price_processing_at:null/.test(js),
              mobileNoBulkWorker:/mobile\|\|source\.length>8/.test(js)&&/V14\.priceQueue\.length=0/.test(js),
              fastPriceApi:/const fast=/.test(fs.readFileSync('api/mypcards-public.js','utf8'))&&/Fast Reader/.test(fs.readFileSync('api/mypcards-public.js','utf8'))&&/fetchJina\(directLink,8000\)/.test(fs.readFileSync('api/mypcards-public.js','utf8')),
              mobileCreatorNonModal:/openBinderCreator/.test(js)&&/\.show\(\)/.test(js)&&/showModal\(\)/.test(js)&&/max-width:820px/.test(css)&&/v14-binder-dialog\[open\]/.test(css),
              mobileReleaseGuard:/releaseMobileInteraction/.test(js)&&/hardCloseDialog/.test(js)&&/setTimeout\(releaseMobileInteraction,650\)/.test(js),
              masterBuilderReset:/resetMasterBuilderState/.test(js)&&/masterEpoch/.test(js)&&/epoch!==V14\.masterEpoch/.test(js),
              liveMasterDuplicateCheck:/liveMasterBinderName/.test(js)&&/\.eq\('set_id',setId\)/.test(js),
              closedDialogTapSafety:/dialog\.sheet-dialog:not\(\[open\]\)/.test(css)&&/pointer-events:none!important/.test(css),
              liveSinglePriceSync:/waitForSinglePrice/.test(js)&&/priceRowHasFreshResult/.test(js)&&/renderFreshSinglePrice/.test(js)&&/Atualizando no servidor/.test(js)&&/Aguardando servidor/.test(js),
              workerKick:/db\.functions\?\.invoke\?\.\('pokemon-price-worker'/.test(js)&&/Access-Control-Allow-Origin/.test(fs.readFileSync('supabase/functions/pokemon-price-worker/index.ts','utf8')),
              productionOnlyVercel:(()=>{const v=JSON.parse(fs.readFileSync('vercel.json','utf8'));return v.git?.deploymentEnabled?.main===true&&v.git?.deploymentEnabled?.['*']===false})(),
              removeSingleCard:/btnDeleteSelected/.test(html)&&/Remover esta carta do fichário/.test(html)&&/openRemoveCardDialog/.test(js)&&/confirmRemoveCardFromBinder/.test(js),
              removeSingleCardConfirm:/v1417RemoveCardDialog/.test(html)&&/v1417CancelRemoveCard/.test(html)&&/v1417ConfirmRemoveCard/.test(html)&&/outra cópia não será alterada/.test(html),
              removeSingleCardCss:/v1417-remove-card/.test(css)&&/v1417-remove-card-warning/.test(css),
              masterSemanticVariants:/physicalVariantKey/.test(fs.readFileSync('api/master-set.js','utf8'))&&/variantFoil/.test(fs.readFileSync('api/master-set.js','utf8'))&&/variantSubtype/.test(fs.readFileSync('api/master-set.js','utf8')),
              perSetVariantProfile:/buildSetVariantProfile/.test(fs.readFileSync('api/master-set.js','utf8'))&&/isCoreSetVariant/.test(fs.readFileSync('api/master-set.js','utf8'))&&/languageMatches/.test(fs.readFileSync('api/master-set.js','utf8')),
              masterMarkAll:/v1418MarkAll/.test(js)&&/markAllMasterOwned/.test(js)&&/Marcar todas como Tenho/.test(js),
              multiMasterBinder:/v1418AddAnotherMaster/.test(js)&&/masterSelections/.test(js)&&/masterPreviewsForCreate/.test(js)&&/Criar fichário com/.test(js),
              generalStatusFilter:/activeStatusFilter/.test(js)&&/arr=arr\.filter\(c=>\(c\.collection_status\|\|'owned'\)===activeStatusFilter\)/.test(js)
            };
            const pass=masterPass&&classicPass&&set151Pass&&jp151Pass&&imagePass&&Object.values(assertions).every(Boolean);
            const out={pass,master:{status:master.status,set:master.body?.set,entries:entries.length,exeggcute},classic:{status:classic.status,set:classic.body?.set,entries:classicEntries.length,fallback:classic.body?.fallbackLanguageUsed,debug:classic.body?.debug},set151:{status:set151.status,entries:entries151.length,charm004},jp151:{status:jp151.status,entries:jpEntries.length,charm004:jpCharm},image:img.body,assertions};
            fs.writeFileSync('v140-core-test-result.json',JSON.stringify(out,null,2));
            console.log(JSON.stringify(out,null,2));
            if(!pass)process.exitCode=1;
          })().catch(e=>{fs.writeFileSync('v140-core-test-result.json',JSON.stringify({pass:false,error:String(e),stack:e.stack},null,2));process.exitCode=1});
          EOF
          node v140-core-test.cjs
