name: V14 core tests
on:
  push:
    branches:
      - v140-production-fixes
    paths:
      - 'v140.js'
      - 'v122.js'
      - 'v140.css'
      - 'index.html'
      - 'script.js'
      - 'api/master-set.js'
      - 'api/card-image-fallback.js'
      - 'api/jp-card-image.js'
      - 'api/image-proxy.js'
      - 'sw.js'
      - 'supabase/functions/pokemon-price-worker/index.ts'
      - '.github/workflows/v140-core-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'v140.js'
      - 'v140.css'
      - 'index.html'
      - 'script.js'
      - 'api/master-set.js'
      - 'api/card-image-fallback.js'
      - 'api/jp-card-image.js'
      - 'api/image-proxy.js'
      - 'sw.js'
      - '.github/workflows/v140-core-tests.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Static syntax
        run: |
          node --check script.js
          node --check v11fix.js
          node --check v122.js
          node --check v140.js
          node --check api/master-set.js
          node --check api/card-image-fallback.js
          node --check api/jp-card-image.js
          node --check api/image-proxy.js
          node --check sw.js
      - name: API behavior
        run: |
          cat > v140-core-test.cjs <<'EOF'
          const fs=require('fs');
          async function invoke(modPath,query){
            const handler=require('./'+modPath);
            return await new Promise((resolve,reject)=>{
              let status=200,headers={};
              const res={
                setHeader(k,v){headers[k]=v;},
                status(n){status=n;return this;},
                json(v){resolve({status,headers,body:v});}
              };
              Promise.resolve(handler({query},res)).catch(reject);
            });
          }
          (async()=>{
            const master=await invoke('api/master-set.js',{lang:'pt',set:'sv08'});
            const entries=master.body?.entries||[];
            const exeggcute=entries.filter(x=>x.apiId==='sv08-001');
            const masterPass=master.status===200&&master.body?.ok&&entries.length>252&&exeggcute.some(x=>x.finish==='Normal')&&exeggcute.some(x=>x.finish==='Reverse Foil');

            const img=await invoke('api/card-image-fallback.js',{name:'Umbreon ex',number:'091',hp:'',rarity:''});
            const imagePass=img.status===200&&img.body?.ok&&/^https?:/.test(img.body?.url||'');

            const js=fs.readFileSync('v140.js','utf8');
            const pageJs=fs.readFileSync('v11fix.js','utf8');
            const html=fs.readFileSync('index.html','utf8');
            const css=fs.readFileSync('v140.css','utf8');
            const assertions={
              backgroundPrice:/queueBackgroundPrices/.test(js)&&/price_pending/.test(js)&&/Adicionando/.test(js),
              multiBinder:/pokemon_binders/.test(js)&&/Geral — todos os fichários/.test(js),
              sortGuard:/Movimentação só fica disponível/.test(js),
              scanner:/ocrCard/.test(js)&&/scanLiveTick/.test(js)&&/Confirme a carta/.test(js)&&/visuallyRankCandidates/.test(js)&&/image-proxy/.test(js),
              masterSet:/api\/master-set/.test(js)&&/Master Set/.test(js)&&/queueBackgroundPrices\(\[\.\.\.collection\]\)/.test(js),
              japanese:/card-image-fallback/.test(js)&&/jp-card-image/.test(js),
              priceSort:/price_desc/.test(js)&&/price_asc/.test(js)&&/maior → menor/.test(js)&&/menor → maior/.test(js),
              favorites:/favorites/.test(js)&&/canonicalCardIdentityKey/.test(js)&&/★ Favoritas/.test(js),
              groupedGeneral:/groupedVirtualCards/.test(js)&&/_group_count/.test(js),
              valueScope:/summary_value_scope/.test(js)&&/Só as que tenho/.test(js)&&/Só as que não tenho/.test(js),
              mobileArtifact:!html.includes('\\\\n'),
              valueScopeCss:/v14-value-scope-control/.test(css),
              mobileBinderControls:/querySelector\('\.binder-area'\)/.test(js)&&/top:48px/.test(css)&&/binder-stage\{padding:96px 10px 10px!important\}/.test(css),
              mobileCardValues:/V14\.3 — mobile card values/.test(css)&&/\.pocket-card \.card-value/.test(css)&&/display:block!important/.test(css),
              masterGenerationFlow:/v14SeriesSelect/.test(js)&&/v14SetSelect/.test(js)&&/\/series\//.test(js),
              masterDuplicate:/nextMasterBinderName/.test(js)&&/set_id===setId/.test(js),
              masterImmediateReload:/await loadCardsV14\(false\)/.test(js)&&/aparecia vazio/.test(js),
              masterPromos:/isPromoSet/.test(js)&&/Promos não são misturadas automaticamente/.test(js),
              mobileDelete:/v14DeleteBinder/.test(js)&&/display:grid!important/.test(css),
              summaryOverlay:/z-index:75/.test(css),
              desktopUnifiedTopbar:/v14UnifiedTopbar/.test(js)&&/ensureUnifiedTopbar/.test(js)&&/positionUnifiedTopbar/.test(js)&&/v14-unified-topbar/.test(css)&&/border-right:1px solid/.test(css),
              directionalSort:/manual_asc/.test(js)&&/manual_desc/.test(js)&&/name_asc/.test(js)&&/name_desc/.test(js)&&/number_asc/.test(js)&&/number_desc/.test(js),
              binderViewScope:/binder_view_scope/.test(js)&&/v14BinderViewScope/.test(js)&&/Mostrar no fichário/.test(js),
              viewScopeCss:/v14-binder-view-scope/.test(css),
              rapidPageSkip:/cancelPageFlip/.test(pageJs)&&/pageFlipSuppressUntil/.test(pageJs)&&/rapidWindow/.test(pageJs)&&/pageFlipBusy/.test(pageJs),
              topbarBinderEdges:/binder-spread/.test(js)&&/bar\.style\.left=\(sr\.left-ar\.left\)\+'px'/.test(js)&&/bar\.style\.width=sr\.width\+'px'/.test(js)&&/bar\.style\.transform='none'/.test(js),
              goStart:/v14GoStart/.test(js)&&/goToBinderStart/.test(js)&&/cancelBinderPageFlipV14/.test(pageJs),
              binderSearch:/v14BinderSearch/.test(js)&&/binderSearchScore/.test(js)&&/goToBinderSearchCard/.test(js)&&/v14-binder-search/.test(css),
              filteredPriceRefresh:/visiblePriceTargetCards/.test(js)&&/updateVisiblePricesV14/.test(js)&&/Atualizar preços visíveis/.test(fs.readFileSync('v122.js','utf8')),
              singleCardPrice:/btnUpdateCardPrice/.test(html)&&/updateEditingCardPriceNow/.test(js)&&/price_priority:100/.test(js),
              persistentPriceState:/price_processing_at/.test(js)&&/price_next_retry_at/.test(js)&&/price_last_error/.test(js),
              persistentWorkerSource:fs.existsSync('supabase/functions/pokemon-price-worker/index.ts')
            };
            const pass=masterPass&&imagePass&&Object.values(assertions).every(Boolean);
            const out={pass,master:{status:master.status,set:master.body?.set,entries:entries.length,exeggcute},image:img.body,assertions};
            fs.writeFileSync('v140-core-test-result.json',JSON.stringify(out,null,2));
            if(!pass)process.exitCode=1;
          })().catch(e=>{fs.writeFileSync('v140-core-test-result.json',JSON.stringify({pass:false,error:String(e),stack:e.stack},null,2));process.exitCode=1});
          EOF
          node v140-core-test.cjs
