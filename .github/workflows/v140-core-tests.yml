name: Core checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check (browser, api, lib)
        run: |
          for f in script.js v8.js v11fix.js v12.js v122.js v140.js sw.js api/*.js lib/*.js scripts/*.mjs; do
            node --check "$f"
          done
      - name: Type-strip check of the price worker
        run: |
          sed -e '/^import /d' -e '/^Deno.serve/,$d' supabase/functions/pokemon-price-worker/index.ts > /tmp/worker.mts
          node --experimental-strip-types /tmp/worker.mts
      - name: Asset versions match the service worker
        run: node scripts/check-build.mjs
