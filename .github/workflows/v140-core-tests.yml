name: V14 core tests
on:
  push:
    branches:
      - v140-production-fixes
    paths:
      - 'v140.js'
      - 'v140.css'
      - 'index.html'
      - 'script.js'
      - 'api/master-set.js'
      - 'api/card-image-fallback.js'
      - 'api/jp-card-image.js'
      - 'sw.js'
      - '.github/workflows/v140-core-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'v140.js'
      - 'v140.css'
      - 'index.html'
      - 'script.js'
      - 'api/master-set.js'
      - 'api/card-image-fallback.js'
      - 'api/jp-card-image.js'
      - 'api/image-proxy.js'
      - 'sw.js'
      - '.github/workflows/v140-core-tests.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Static syntax
        run: |
          node --check script.js
          node --check v140.js
          node --check api/master-set.js
          node --check api/card-image-fallback.js
          node --check api/jp-card-image.js
          node --check api/image-proxy.js
          node --check sw.js
      - name: API behavior
        run: |
          cat > v140-core-test.cjs <<'EOF'
          const fs=require('fs');
          async function invoke(modPath,query){
            const handler=require('./'+modPath);
            return await new Promise((resolve,reject)=>{
              let status=200,headers={};
              const res={
                setHeader(k,v){headers[k]=v;},
                status(n){status=n;return this;},
                json(v){resolve({status,headers,body:v});}
              };
              Promise.resolve(handler({query},res)).catch(reject);
            });
          }
          (async()=>{
            const master=await invoke('api/master-set.js',{lang:'pt',set:'sv08'});
            const entries=master.body?.entries||[];
            const exeggcute=entries.filter(x=>x.apiId==='sv08-001');
            const masterPass=master.status===200&&master.body?.ok&&entries.length>252&&exeggcute.some(x=>x.finish==='Normal')&&exeggcute.some(x=>x.finish==='Reverse Foil');

            const img=await invoke('api/card-image-fallback.js',{name:'Umbreon ex',number:'091',hp:'',rarity:''});
            const imagePass=img.status===200&&img.body?.ok&&/^https?:/.test(img.body?.url||'');

            const js=fs.readFileSync('v140.js','utf8');
            const html=fs.readFileSync('index.html','utf8');
            const css=fs.readFileSync('v140.css','utf8');
            const assertions={
              backgroundPrice:/queueBackgroundPrices/.test(js)&&/price_pending/.test(js)&&/Adicionando/.test(js),
              multiBinder:/pokemon_binders/.test(js)&&/Geral — todos os fichários/.test(js),
              sortGuard:/Movimentação só fica disponível/.test(js),
              scanner:/ocrCard/.test(js)&&/scanLiveTick/.test(js)&&/Confirme a carta/.test(js)&&/visuallyRankCandidates/.test(js)&&/image-proxy/.test(js),
              masterSet:/api\/master-set/.test(js)&&/Master Set/.test(js)&&/Preços de Tenho e Não tenho/.test(js),
              japanese:/card-image-fallback/.test(js)&&/jp-card-image/.test(js),
              priceSort:/price_desc/.test(js)&&/price_asc/.test(js)&&/maior → menor/.test(js)&&/menor → maior/.test(js),
              favorites:/favorites/.test(js)&&/canonicalCardIdentityKey/.test(js)&&/★ Favoritas/.test(js),
              groupedGeneral:/groupedVirtualCards/.test(js)&&/_group_count/.test(js),
              valueScope:/summary_value_scope/.test(js)&&/Só as que tenho/.test(js)&&/Só as que não tenho/.test(js),
              mobileArtifact:!html.includes('\\\\n'),
              valueScopeCss:/v14-value-scope-control/.test(css)
            };
            const pass=masterPass&&imagePass&&Object.values(assertions).every(Boolean);
            const out={pass,master:{status:master.status,set:master.body?.set,entries:entries.length,exeggcute},image:img.body,assertions};
            fs.writeFileSync('v140-core-test-result.json',JSON.stringify(out,null,2));
            if(!pass)process.exitCode=1;
          })().catch(e=>{fs.writeFileSync('v140-core-test-result.json',JSON.stringify({pass:false,error:String(e),stack:e.stack},null,2));process.exitCode=1});
          EOF
          node v140-core-test.cjs
