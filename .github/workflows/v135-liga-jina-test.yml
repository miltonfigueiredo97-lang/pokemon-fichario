name: V13.5 Liga Jina exact page test
on:
  push:
    branches:
      - fix-v135-condition-pricing-test
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact Liga URLs through Jina
        run: |
          OUT=v135-liga-jina-result.txt
          : > "$OUT"
          for URL in             "https://r.jina.ai/https://www.ligapokemon.com.br/?view=cards/card%26card=Lugia-EX%20(134/135)%26ed=PLS%26num=134"             "https://r.jina.ai/http://www.ligapokemon.com.br/?view=cards/card%26card=Lugia-EX%20(134/135)%26ed=PLS%26num=134"
          do
            echo "===== $URL =====" >> "$OUT"
            curl -L --max-time 60 -sS -D - "$URL" | head -c 12000 >> "$OUT" || true
            echo >> "$OUT"
          done
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v135-liga-jina-result.txt
          git commit -m "Record exact Liga Jina test" || exit 0
          git push origin HEAD:fix-v135-condition-pricing-test
