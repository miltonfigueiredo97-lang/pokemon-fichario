name: Inspect MYP price summary

on:
  push:
    branches:
      - diagnose-v13-production
    paths:
      - '.github/workflows/browser-price-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect summary DOM
        run: |
          cat > probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({
            locale:'pt-BR',
            userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          });
          const urls=[
            ['lugiaV','https://mypcards.com/pokemon/produto/174895/lugia-v'],
            ['lugiaEX','https://mypcards.com/pokemon/produto/38909/lugia-ex'],
            ['omanyte','https://mypcards.com/pokemon/produto/206053/omanyte']
          ];
          const out={};
          for(const [key,url] of urls){
            const page=await context.newPage();
            const resp=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(5000);
            out[key]=await page.evaluate(()=>({
              status:document.title,
              body:(document.body?.innerText||'').slice(0,8000),
              money:[...document.querySelectorAll('body *')].filter(el=>{
                const t=(el.textContent||'').trim();
                return /^R\$\s*[\d.,]+$/.test(t);
              }).slice(0,80).map(el=>({
                text:(el.textContent||'').trim(),
                tag:el.tagName,
                cls:el.className||'',
                id:el.id||'',
                parent:(el.parentElement?.outerHTML||'').slice(0,2400)
              }))
            }));
            out[key].httpStatus=resp?.status()||0;
            await page.close();
          }
          fs.writeFileSync('myp-price-summary-dom.json',JSON.stringify(out,null,2));
          await browser.close();
          EOF
          node probe.mjs
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add myp-price-summary-dom.json
          git commit -m "Record MYP summary DOM" || exit 0
          git push origin HEAD:diagnose-v13-production
