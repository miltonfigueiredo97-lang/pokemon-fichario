name: Browser price probe

on:
  push:
    branches:
      - diagnose-v13-production
    paths:
      - '.github/workflows/browser-price-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Open MYP in real Chromium
        run: |
          cat > probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({
            locale:'pt-BR',
            userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          });
          const page=await context.newPage();
          let status=0,error='';
          try{
            const resp=await page.goto('https://mypcards.com/pokemon',{waitUntil:'domcontentloaded',timeout:90000});
            status=resp?.status()||0;
            await page.waitForTimeout(5000);
          }catch(e){error=String(e)}
          const title=await page.title().catch(()=> '');
          const forms=await page.locator('form').evaluateAll(fs=>fs.map(f=>({
            action:f.action,
            method:f.method,
            html:f.outerHTML.slice(0,4000)
          })).slice(0,20)).catch(()=>[]);
          const inputs=await page.locator('input').evaluateAll(xs=>xs.map(x=>({
            name:x.name,id:x.id,type:x.type,placeholder:x.placeholder,value:x.value
          })).slice(0,100)).catch(()=>[]);
          const links=await page.locator('a').evaluateAll(as=>as.map(a=>({
            text:(a.innerText||'').trim(),href:a.href
          })).filter(x=>/buscar|pesquis|search/i.test(x.text)||/search|busca|pesquisa/i.test(x.href)).slice(0,100)).catch(()=>[]);
          fs.writeFileSync('myp-search-form-probe.json',JSON.stringify({status,title,error,forms,inputs,links},null,2));
          await browser.close();
          EOF
          node probe.mjs

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add myp-search-form-probe.json
          git commit -m "Record MYP search form probe" || exit 0
          git push origin HEAD:diagnose-v13-production
