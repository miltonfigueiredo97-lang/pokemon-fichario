name: Browser price probe

on:
  push:
    branches:
      - diagnose-v13-production
    paths:
      - '.github/workflows/browser-price-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Open MYP in real Chromium
        run: |
          cat > probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const url='https://mypcards.com/pokemon/produto/38909/lugia-ex';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({
            locale:'pt-BR',
            userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          });
          const page=await context.newPage();
          let status=0,error='';
          try{
            const resp=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
            status=resp?.status()||0;
            await page.waitForTimeout(12000);
          }catch(e){error=String(e)}
          const title=await page.title().catch(()=> '');
          const text=(await page.locator('body').innerText().catch(()=> '')).slice(0,30000);
          let sellerDom='';
          try{
            const loc=page.getByText('Deckzy',{exact:true}).first();
            sellerDom=await loc.evaluate(el=>{
              let cur=el;
              for(let i=0;i<8&&cur;i++,cur=cur.parentElement){
                const t=(cur.innerText||'');
                if(t.includes('Deckzy')&&t.includes('R$ 999,99')) return cur.outerHTML;
              }
              return el.parentElement?.outerHTML||el.outerHTML;
            });
          }catch{}
          const result={utc:new Date().toISOString(),status,title,error,text,sellerDom};
          fs.writeFileSync('browser-price-probe.json',JSON.stringify(result,null,2));
          await browser.close();
          EOF
          node probe.mjs

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser-price-probe.json
          git commit -m "Record Chromium MYP probe" || exit 0
          git push origin HEAD:diagnose-v13-production
