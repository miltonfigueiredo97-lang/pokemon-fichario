name: Browser price probe

on:
  push:
    branches:
      - diagnose-v13-production
    paths:
      - '.github/workflows/browser-price-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Open MYP in real Chromium
        run: |
          cat > probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({
            locale:'pt-BR',
            userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          });
          const page=await context.newPage();
          const q='Lugia V 138/195';
          const url='https://mypcards.com/pokemon?ProdutoSearch%5Bmarca%5D=pokemon&ProdutoSearch%5Bquery%5D='+encodeURIComponent(q);
          let status=0,error='';
          try{
            const resp=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
            status=resp?.status()||0;
            await page.waitForTimeout(5000);
          }catch(e){error=String(e)}
          const title=await page.title().catch(()=> '');
          const productLinks=await page.locator('a[href*="/pokemon/produto/"]').evaluateAll(as=>as.map(a=>({
            text:(a.innerText||a.textContent||'').trim(),
            href:a.href,
            title:a.getAttribute('title')||'',
            parent:(a.closest('article,li,div')?.innerText||'').trim().slice(0,1200)
          })).slice(0,100)).catch(()=>[]);
          const body=(await page.locator('body').innerText().catch(()=> '')).slice(0,12000);
          fs.writeFileSync('myp-search-result-probe.json',JSON.stringify({status,title,error,url,productLinks,body},null,2));
          await browser.close();
          EOF
          node probe.mjs

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add myp-search-result-probe.json
          git commit -m "Record MYP search result probe" || exit 0
          git push origin HEAD:diagnose-v13-production
