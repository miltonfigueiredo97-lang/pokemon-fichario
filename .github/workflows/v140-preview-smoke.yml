name: V14 preview smoke
on:
  push:
    branches:
      - v140-full-overhaul
    paths:
      - '.github/workflows/v140-preview-smoke.yml'
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe Vercel branch preview
        run: |
          BASE="https://pokemon-fichario-git-v140-full-overhaul-mackmus.vercel.app"
          OUT=v140-preview-smoke.json
          sleep 8
          ROOT=$(curl -L --max-time 40 -sS -o /tmp/root -w '%{http_code}' "$BASE/" || true)
          JS=$(curl -L --max-time 40 -sS -o /tmp/js -w '%{http_code}' "$BASE/v140.js" || true)
          MASTER=$(curl -L --max-time 70 -sS -o /tmp/master -w '%{http_code}' "$BASE/api/master-set?lang=pt&set=sv08" || true)
          export ROOT_CODE="$ROOT" JS_CODE="$JS" MASTER_CODE="$MASTER"
          node - <<'EOF'
          const fs=require('fs');
          const root=fs.existsSync('/tmp/root')?fs.readFileSync('/tmp/root','utf8'):'';
          const js=fs.existsSync('/tmp/js')?fs.readFileSync('/tmp/js','utf8'):'';
          let master={};try{master=JSON.parse(fs.readFileSync('/tmp/master','utf8'))}catch{}
          const out={
            rootCode:process.env.ROOT_CODE||'',
            jsCode:process.env.JS_CODE||'',
            masterCode:process.env.MASTER_CODE||'',
            rootSample:root.slice(0,300),
            jsSample:js.slice(0,120),
            masterSample:JSON.stringify(master).slice(0,300),
            rootHasV140:/v140\.js/.test(root),
            jsHasMultiBinder:/pokemon_binders/.test(js),
            jsHasBackgroundPrice:/queueBackgroundPrices/.test(js),
            jsHasScanner:/scanLiveTick/.test(js),
            masterOk:master?.ok===true,
            masterEntries:master?.entries?.length||0
          };
          out.pass=out.rootCode==='200'&&out.jsCode==='200'&&out.masterCode==='200'&&out.rootHasV140&&out.jsHasMultiBinder&&out.jsHasBackgroundPrice&&out.jsHasScanner&&out.masterOk&&out.masterEntries>252;
          fs.writeFileSync('v140-preview-smoke.json',JSON.stringify(out,null,2));
          if(!out.pass)process.exitCode=1;
          EOF
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v140-preview-smoke.json
          git commit -m "Record V14 preview smoke" || exit 0
          git push origin HEAD:v140-full-overhaul
