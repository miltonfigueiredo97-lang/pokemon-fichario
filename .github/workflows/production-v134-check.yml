name: Production V13.4 check
on:
  push:
    branches:
      - diagnose-v13-production
    paths:
      - '.github/workflows/production-v134-check.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe production
        run: |
          OUT=production-v134-check.txt
          : > "$OUT"
          echo "UTC: $(date -u +%FT%TZ)" >> "$OUT"
          echo "===== Lugia V price =====" >> "$OUT"
          curl -L --max-time 70 -sS "https://pokemon-fichario.vercel.app/api/mypcards-public?name=Lugia%20V&number=138%2F195&set=Tempestade%20Prateada&setId=swsh12&lang=pt-br&finish=Foil&condition=Nova" >> "$OUT" || true
          echo >> "$OUT"
          echo "===== V13.4 frontend markers =====" >> "$OUT"
          curl -L --max-time 30 -sS "https://pokemon-fichario.vercel.app/v122.js" | grep -Eo "APP_VERSION='V13\.4'|data-condition-key|priceForNewCard" | sort -u >> "$OUT" || true
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production-v134-check.txt
          git commit -m "Record production V13.4 check" || exit 0
          git push origin HEAD:diagnose-v13-production
