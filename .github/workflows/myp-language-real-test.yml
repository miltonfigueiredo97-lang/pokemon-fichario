name: Test MYP PT-BR language filter
on:
  push:
    branches:
      - fix-v139-myp-language-filter
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Test Mew V PT-BR only
        run: |
          cat > test-language.cjs <<'EOF'
          const fs=require('fs');
          const {findAndScrapeMypBrowser}=require('./lib/myp-browser');
          (async()=>{
            const result=await findAndScrapeMypBrowser(
              'https://mypcards.com/pokemon/produto/146483/mew-v',
              {name:'Mew V',number:'251/264',set:'Golpe Fusão',setId:'swsh8',lang:'pt-br',finish:'Normal',condition:'Nova'}
            );
            const prices=(result.matched||[]).map(x=>x.price);
            const languages=[...new Set((result.matched||[]).map(x=>x.language))];
            const pass=!!(result.ok && languages.every(x=>/portugu/i.test(String(x))) && !prices.includes(449.9));
            fs.writeFileSync('myp-language-real-test.json',JSON.stringify({pass,result},null,2));
            if(!pass)process.exitCode=1;
          })().catch(e=>{fs.writeFileSync('myp-language-real-test.json',JSON.stringify({pass:false,error:String(e),stack:e.stack},null,2));process.exitCode=1});
          EOF
          node test-language.cjs
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add myp-language-real-test.json
          git commit -m "Record MYP PT-BR language test" || exit 0
          git push origin HEAD:fix-v139-myp-language-filter
