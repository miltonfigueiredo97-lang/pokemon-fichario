name: V14 production hotfix tests
on:
  push:
    branches:
      - v140-production-fixes
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check script.js
          node --check v122.js
          node --check v140.js
          node --check api/master-set.js
          node --check api/card-image-fallback.js
          node --check api/jp-card-image.js
      - name: Functional APIs and architecture
        run: |
          cat > v140-hotfix-test.cjs <<'EOF'
          const fs=require('fs');

          async function invoke(modPath,query){
            const handler=require('./'+modPath);
            return await new Promise((resolve,reject)=>{
              const headers={};
              const res={
                statusCode:200,
                setHeader(k,v){headers[k]=v},
                status(n){this.statusCode=n;return this},
                json(v){resolve({status:this.statusCode,headers,body:v})},
                end(v){resolve({status:this.statusCode,headers,body:v||null})}
              };
              Promise.resolve(handler({query},res)).catch(reject);
            });
          }

          (async()=>{
            const master=await invoke('api/master-set.js',{lang:'pt',set:'sv08'});
            const entries=master.body?.entries||[];
            const base=entries.filter(x=>x.apiId==='sv08-001');
            const masterPass=master.status===200 && master.body?.ok &&
              entries.length>252 &&
              base.some(x=>x.finish==='Normal') &&
              base.some(x=>x.finish==='Reverse Foil');

            const jp=await invoke('api/jp-card-image.js',{
              set:'PCG4',
              localId:'091',
              name:'Umbreon ex',
              hp:'',
              rarity:''
            });
            const jpPass=jp.status===302 && /^https?:\/\//.test(jp.headers?.Location||'');

            const js=fs.readFileSync('v140.js','utf8');
            const script=fs.readFileSync('script.js','utf8');
            const v122=fs.readFileSync('v122.js','utf8');
            const assertions={
              priceInBackground:/price_pending/.test(js)&&/queueBackgroundPrices/.test(js)&&/runPriceWorker/.test(js)&&/Preço atualizando em segundo plano/.test(js),
              addClosesBeforePrice:/addDialog/.test(js)&&/queueBackgroundPrices\(saved\)/.test(js),
              multipleBinders:/pokemon_binders/.test(js)&&/Geral — todos os fichários/.test(js)&&/＋ Fichário/.test(js),
              renameDelete:/renameBinder/.test(js)&&/deleteBinder/.test(js),
              sorts:/Ordem do fichário/.test(js)&&/Alfabética/.test(js)&&/Raridade/.test(js)&&/Número da coleção/.test(js),
              dragGuard:/canMove/.test(js)&&/Movimentação só fica disponível/.test(js),
              masterSet:/api\/master-set/.test(js)&&/Marque as variantes/.test(js),
              scanner:/ocrCard/.test(js)&&/scanLiveTick/.test(js)&&/v14ScanCandidates/.test(js)&&/Confirme a carta/.test(js),
              jpFallback:/api\/jp-card-image/.test(script)&&/api\/jp-card-image/.test(js),
              mypOnly:/queryBothMarketsV122/.test(js)&&!js.includes("querySource('/api/liga-public'"),
              legacyFastAdd:/backgroundPriceNewCard/.test(v122)
            };

            const pass=masterPass&&jpPass&&Object.values(assertions).every(Boolean);
            fs.writeFileSync('v140-hotfix-test-result.json',JSON.stringify({
              pass,
              master:{status:master.status,set:master.body?.set?.name,entries:entries.length,baseVariants:base.map(x=>x.finish)},
              japanese:{status:jp.status,location:jp.headers?.Location||'',fallback:jp.headers?.['X-Pokemon-Image-Fallback']||''},
              assertions
            },null,2));
            if(!pass)process.exitCode=1;
          })().catch(e=>{
            fs.writeFileSync('v140-hotfix-test-result.json',JSON.stringify({pass:false,error:String(e),stack:e.stack},null,2));
            process.exitCode=1;
          });
          EOF
          node v140-hotfix-test.cjs
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f v140-hotfix-test-result.json ]; then
            git add v140-hotfix-test-result.json
            git commit -m "Record V14 production hotfix test" || exit 0
            git push origin HEAD:v140-production-fixes
          fi
